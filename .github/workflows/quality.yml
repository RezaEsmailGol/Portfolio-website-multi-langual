name: Portfolio quality checks

on:
  push:
    branches:
      - main
      - feat/professional-multilingual-portfolio-2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Static quality and translation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: node --check script.js
      - name: Run portfolio tests
        run: node --test tests/site.test.mjs
